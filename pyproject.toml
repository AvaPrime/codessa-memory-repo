[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codessa-memory"
version = "0.1.0"
description = "Codessa Memory Layer starter repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.1",
  "uvicorn>=0.42.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "numpy>=2.3.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "pip-audit>=2.9.0",
]
embeddings = [
  "sentence-transformers>=5.1.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
  "supabase>=2.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
